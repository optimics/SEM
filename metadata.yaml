homepage: https://www.optimics.cz
documentation: https://github.com/optimics/SEM/blob/main/README.md
versions:
  - sha: f149c59477e28d9249be9ead521d875246820b3e
    changeNotes: >-
      v3.0.0 — a smaller UI on top of the 2.3.1 behavior: event and user data
      go into an object or a Key – Value table with keys picked from a list;
      Console logging levels no/debug/always; validation is always strict;
      sznaiid is last touch with a 30-day lifetime; client IP and User-Agent
      come from the GA4 event data first. The v2.x controls keep working in the
      collapsed group "Starší pole (v2.x)" and are reported in one WARN; fields
      hidden by the 2.x input mode apply again. Read the upgrade notes in
      CHANGELOG.md and the README section "Přechod na verzi 3" before updating.
  - sha: 6161f451b65b60b009c123af11e1209f87e9ac6f
    changeNotes: >-
      v2.3.1 — correctness patch. The payload is assembled, normalized and
      validated once: null, undefined and NaN values and items with an invalid
      quantity are dropped, values get their wire types, unknown keys are dropped
      with a WARN. A Purchase needs order_id, currency and value and is now sent
      when they come from the Event Data Object or the overrides. Malformed
      consent fails the tag with an ERROR; malformed JSON no longer crashes the
      tag. Read the upgrade notes in CHANGELOG.md before updating.
  - sha: dce923163b003730beecb137854b79099e9fd2b8
    changeNotes: >-
      v2.3 — sid/udid auto-map from request cookies (shape-validated, lowest-
      priority fallback), Object vs Individual fields input modes for User/Event
      Data, rebrand to "Seznam SEM (Server-Side)", and BigQuery logging table
      schema/DDL in the README. Server-side template for sending conversion
      events to the Seznam SEM (Seznam Event Measurement) API.
